<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F43F5E"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="820" fill="#0D1117" rx="12"/>

  <text x="550" y="42" text-anchor="middle" fill="#00E5FF" font-size="22" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">claude-session-monitor 生命周期</text>

  <!-- Row 1: User -> Claude Code -->
  <rect x="80" y="75" width="140" height="50" rx="25" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="106" text-anchor="middle" fill="#FFFFFF" font-size="16" font-family="Microsoft YaHei, PingFang SC, sans-serif">用户</text>

  <line x1="220" y1="100" x2="360" y2="100" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="290" y="92" text-anchor="middle" fill="#64748B" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">提交 Prompt</text>

  <rect x="370" y="75" width="180" height="50" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="106" text-anchor="middle" fill="#FFFFFF" font-size="16" font-family="Microsoft YaHei, PingFang SC, sans-serif">Claude Code</text>

  <!-- Hooks area -->
  <rect x="55" y="155" width="990" height="240" rx="12" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="75" y="178" fill="#64748B" font-size="13" font-family="Microsoft YaHei, PingFang SC, sans-serif">Claude Code Hooks (自动触发)</text>

  <!-- UserPromptSubmit -->
  <rect x="80" y="200" width="200" height="55" rx="10" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="224" text-anchor="middle" fill="#3B82F6" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">UserPromptSubmit</text>
  <text x="180" y="244" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">hook: session-start.mjs</text>

  <line x1="280" y1="227" x2="390" y2="227" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- recordSessionStart -->
  <rect x="400" y="195" width="220" height="65" rx="10" fill="#162232" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="218" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">recordSessionStart()</text>
  <text x="510" y="238" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">记录 startedAt / cwd</text>
  <text x="510" y="253" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">promptPreview</text>

  <!-- Stop -->
  <rect x="80" y="285" width="200" height="55" rx="10" fill="#1E3A5F" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="309" text-anchor="middle" fill="#10B981" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">Stop</text>
  <text x="180" y="329" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">hook: session-stop.mjs</text>

  <line x1="280" y1="312" x2="390" y2="312" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- recordSessionStop -->
  <rect x="400" y="280" width="220" height="65" rx="10" fill="#162232" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="303" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">recordSessionStop()</text>
  <text x="510" y="323" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">计算 durationMs</text>
  <text x="510" y="338" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">检测 error 字段</text>

  <!-- Data storage -->
  <rect x="700" y="200" width="240" height="145" rx="12" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="820" y="222" text-anchor="middle" fill="#64748B" font-size="13" font-family="Microsoft YaHei, PingFang SC, sans-serif">数据存储</text>

  <rect x="720" y="240" width="200" height="85" rx="8" fill="#1E293B" stroke="#30363D" stroke-width="1" filter="url(#shadow)"/>
  <text x="820" y="266" text-anchor="middle" fill="#F97316" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">session-state.json</text>
  <text x="820" y="288" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">{ startedAt, cwd,</text>
  <text x="820" y="304" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">  promptPreview, notifiedAt,</text>
  <text x="820" y="320" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Microsoft YaHei, PingFang SC, sans-serif">  notificationCount ... }</text>

  <line x1="620" y1="250" x2="718" y2="260" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="669" y="246" text-anchor="middle" fill="#64748B" font-size="10" font-family="Microsoft YaHei, PingFang SC, sans-serif">写入</text>

  <line x1="620" y1="310" x2="718" y2="300" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="669" y="324" text-anchor="middle" fill="#64748B" font-size="10" font-family="Microsoft YaHei, PingFang SC, sans-serif">读写</text>

  <!-- Decision flow -->
  <line x1="510" y1="345" x2="510" y2="435" stroke="#94A3B8" stroke-width="2"/>

  <!-- Diamond: failed? -->
  <polygon points="510,440 600,500 510,560 420,500" fill="#1E293B" stroke="#F97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="497" text-anchor="middle" fill="#F97316" font-size="13" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">失败?</text>

  <!-- Failure left -->
  <line x1="420" y1="500" x2="220" y2="500" stroke="#F43F5E" stroke-width="2"/>
  <text x="320" y="492" text-anchor="middle" fill="#F43F5E" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">是</text>

  <rect x="80" y="470" width="140" height="60" rx="10" fill="#3B1414" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="495" text-anchor="middle" fill="#F43F5E" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">失败通知</text>
  <text x="150" y="515" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="Microsoft YaHei, PingFang SC, sans-serif">(首次即通知)</text>

  <!-- Success right -->
  <line x1="600" y1="500" x2="850" y2="500" stroke="#10B981" stroke-width="2"/>
  <text x="725" y="492" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">否 (成功)</text>

  <!-- Diamond: duration > 30s? -->
  <polygon points="860,470 950,515 860,560 770,515" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860" y="511" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">耗时</text>
  <text x="860" y="527" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">&gt; 30s?</text>

  <!-- Not notify -->
  <line x1="950" y1="515" x2="1020" y2="515" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="930" y="495" width="70" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <text x="965" y="520" text-anchor="middle" fill="#64748B" font-size="12" font-family="Microsoft YaHei, PingFang SC, sans-serif">不通知</text>
  <text x="965" y="552" text-anchor="middle" fill="#64748B" font-size="10" font-family="Microsoft YaHei, PingFang SC, sans-serif">短请求</text>

  <!-- Long notify -->
  <line x1="860" y1="560" x2="860" y2="610" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="875" y="590" fill="#10B981" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">是</text>

  <rect x="740" y="615" width="240" height="60" rx="10" fill="#142B1A" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860" y="640" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">长耗时通知</text>
  <text x="860" y="660" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="Microsoft YaHei, PingFang SC, sans-serif">(同会话最多 3 次)</text>

  <!-- Rules summary -->
  <rect x="80" y="710" width="940" height="85" rx="10" fill="#1A1F2E" stroke="#30363D" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="735" text-anchor="middle" fill="#F97316" font-size="14" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">通知控制规则</text>
  <text x="140" y="760" fill="#94A3B8" font-size="12" font-family="Microsoft YaHei, PingFang SC, sans-serif">1. 失败通知: 首次失败立即发送, failureNotifiedAt 防同一错误重复通知</text>
  <text x="140" y="780" fill="#94A3B8" font-size="12" font-family="Microsoft YaHei, PingFang SC, sans-serif">2. 成功通知: 仅耗时 > 30秒时发送, notifiedAt 防重复  3. 每个会话最多通知 3 次 (MAX_NOTIFICATIONS_PER_SESSION)</text>
</svg>